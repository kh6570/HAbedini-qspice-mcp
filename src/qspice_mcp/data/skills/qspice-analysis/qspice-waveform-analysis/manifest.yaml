# In the name of God, the Most Gracious, the Most Merciful
schema_version: 1
license: MIT
scope: cross-product
version: "1.1"
human-description: Inspect, derive, and measure QSpice waveform results after a simulation.
requires-tools:
  - list_signals
  - list_steps
  - read_waveform
  - evaluate_waveform_expression
  - measure_waveform
  - plot_waveforms
  - prepare_four
  - read_fourier
  - compute_thd
  - export_fft_spectrum
  - measure_bode_response
  - prepare_meas
  - list_measures
  - read_measures
  - read_noise
  - export_waveform_csv
requires-skills:
  - qspice-getting-started
requires-products: []
toolkit: qspice-mcp
when-not-to-use: Do not use this when the run failed or produced no waveform, or when you still need to author or simulate the circuit. Use qspice-convergence-debugging or qspice-getting-started.
reference-files:
  - workflow.md
