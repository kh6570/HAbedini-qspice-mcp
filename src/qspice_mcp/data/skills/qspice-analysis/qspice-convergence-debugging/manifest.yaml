# In the name of God, the Most Gracious, the Most Merciful
schema_version: 1
license: MIT
scope: cross-product
version: "1.1"
human-description: Diagnose and fix QSpice simulations that fail to converge, stop early, or produce no usable waveform.
requires-tools:
  - read_log
  - prepare_options
  - inspect_schematic
  - list_components
  - run_simulation
  - generate_netlist
  - set_component_value
  - set_component_parameters
  - add_component
  - list_signals
  - measure_waveform
requires-skills:
  - qspice-getting-started
requires-products: []
toolkit: qspice-mcp
when-not-to-use: Do not use this for a missing QSPICE_EXE, connected=false, or a backend-unavailable error. Those are setup problems; call describe_server_capabilities.
reference-files:
  - workflow.md
  - options.md
