# In the name of God, the Most Gracious, the Most Merciful
schema_version: 1
license: MIT
scope: cross-product
version: "1.1"
human-description: Simulate and characterize switching power converters in QSpice — transient, efficiency, step response, and loop-gain stability.
requires-tools:
  - materialize_reference_circuit
  - inspect_schematic
  - check_schematic
  - prepare_transient
  - prepare_save
  - prepare_options
  - run_simulation
  - read_waveform
  - measure_waveform
  - measure_step_response
  - measure_efficiency
  - prepare_loop_gain_analysis
  - prepare_ac
  - prepare_bode_analysis
  - measure_stability_margins
  - prepare_meas
  - read_measures
requires-skills:
  - qspice-getting-started
  - qspice-convergence-debugging
requires-products: []
toolkit: qspice-mcp
when-not-to-use: Do not use this when the run fails to converge or when you only need a generic waveform scalar. Use qspice-convergence-debugging first for a failed run, and qspice-waveform-analysis for ordinary trace math.
reference-files:
  - workflow.md
  - bode.md
  - buck-from-scratch.md
  - loop-gain.md
