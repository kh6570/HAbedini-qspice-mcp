# In the name of God, the Most Gracious, the Most Merciful
schema_version: 1
license: MIT
scope: cross-product
version: "1.1"
human-description: Drive the QSpice MCP server end to end — discover or author a circuit, simulate, and read or measure waveforms.
requires-tools:
