  - list_reference_circuit_recipes
  - describe_reference_circuit_recipe
  - materialize_reference_circuit
  - inspect_schematic
  - generate_netlist
  - run_simulation
  - read_log
  - list_signals
  - measure_waveform
  - read_waveform
requires-skills: []
requires-products: []
