default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        files: ^src/
        args: [--strict]
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - numpy>=1.26
          - types-setuptools

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: check-no-third-party-imports
        name: check no third-party imports
        entry: python scripts/check_no_third_party_imports.py
        language: system
        pass_filenames: false
      - id: check-test-ci-safety
        name: check test CI safety
        entry: python scripts/check_test_ci_safety.py
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest (unit only)
        entry: python -m pytest -m "not integration and not slow" -q
        language: system
        pass_filenames: false
        stages: [pre-push]
