name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bare-install-smoke:
    name: Bare MCP Install Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package only
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Smoke test packaged MCP CLI
        run: qspice-mcp --describe

      - name: MCP cold-start budget probe
        run: python scripts/verify_mcp_stdio.py 30

  quality:
    name: Lint, Type-check, Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backends]"

      - name: Pre-commit quality gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          pre-commit run ruff --all-files --show-diff-on-failure
          pre-commit run ruff-format --all-files --show-diff-on-failure
          pre-commit run check-no-third-party-imports --all-files --show-diff-on-failure
          pre-commit run check-test-ci-safety --all-files --show-diff-on-failure
          pre-commit run check-tool-reference-drift --all-files --show-diff-on-failure
          pre-commit run check-mcp-env-drift --all-files --show-diff-on-failure
          pre-commit run check-markdown-docs --all-files --show-diff-on-failure
          pre-commit run check-tool-metadata-casing --all-files --show-diff-on-failure

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy --strict src/

      - name: Unit tests
        run: pytest -m "not integration" --cov --cov-report=xml --cov-report=term

      - name: Package coverage floors
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/check_package_coverage.py

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
