name: Integration

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: Python version for the integration session
        required: true
        default: "3.12"
        type: choice
        options:
          - "3.11"
          - "3.12"
      qspice-exe:
        description: Optional QSPICE_EXE override for the self-hosted runner
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Suite
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      QSPICE_EXE: ${{ inputs.qspice-exe }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,backends]"

      - name: Probe QSpice
        run: qspice-mcp --describe

      - name: Run integration suite
        run: >-
          python -m nox -s integration --force-python ${{ inputs.python-version }}
          -- --junitxml=integration-results.xml

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ github.run_id }}
          path: |
            integration-results.xml
            artifacts/**
            tmp/**
          if-no-files-found: ignore